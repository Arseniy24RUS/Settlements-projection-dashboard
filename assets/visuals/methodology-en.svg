<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Projection methodology flow</title>
  <desc id="desc">Base population combines with fertility, mortality and migration assumptions to produce settlement projections.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10 Z" fill="#059669"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="460" fill="#f1f5f0"/>
  <text x="56" y="72" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Projection methodology flow</text>
  <text x="56" y="106" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">From observed settlement baseline to scenario-based local population trajectories</text>
  <g filter="url(#shadow)">
    <rect x="72" y="168" width="282" height="176" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="459" y="142" width="282" height="228" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="846" y="168" width="282" height="176" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="103" y="216" font-size="25" font-weight="700" fill="#0f172a">Base population</text>
    <text x="103" y="256" font-size="17" fill="#475569">settlement counts by age</text>
    <text x="103" y="286" font-size="17" fill="#475569">sex and observed year</text>
    <rect x="103" y="306" width="144" height="32" rx="16" fill="#dbeafe"/>
    <text x="123" y="327" font-size="15" font-weight="700" fill="#1d4ed8">2021 baseline</text>

    <text x="490" y="194" font-size="25" font-weight="700" fill="#0f172a">Assumptions</text>
    <text x="490" y="232" font-size="17" fill="#475569">scenario inputs applied to each</text>
    <text x="490" y="260" font-size="17" fill="#475569">settlement or territorial group</text>
    <rect x="490" y="288" width="108" height="34" rx="17" fill="#dcfce7"/>
    <text x="512" y="310" font-size="15" font-weight="700" fill="#047857">fertility</text>
    <rect x="610" y="288" width="108" height="34" rx="17" fill="#fee2e2"/>
    <text x="628" y="310" font-size="15" font-weight="700" fill="#b91c1c">mortality</text>
    <rect x="490" y="332" width="126" height="34" rx="17" fill="#fce7f3"/>
    <text x="512" y="354" font-size="15" font-weight="700" fill="#be185d">migration</text>

    <text x="877" y="216" font-size="25" font-weight="700" fill="#0f172a">Settlement projection</text>
    <text x="877" y="256" font-size="17" fill="#475569">population trajectories</text>
    <text x="877" y="286" font-size="17" fill="#475569">map years and age-sex outputs</text>
    <rect x="877" y="306" width="122" height="32" rx="16" fill="#e0f2fe"/>
    <text x="898" y="327" font-size="15" font-weight="700" fill="#0369a1">to 2100</text>
  </g>
  <g stroke="#059669" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
    <line x1="354" y1="256" x2="449" y2="256"/>
    <line x1="741" y1="256" x2="836" y2="256"/>
  </g>
  <path d="M213 384 C420 420 770 420 987 384" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 10"/>
  <text x="405" y="424" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">Scenario comparison keeps the baseline visible while assumptions change the forecast path.</text>
</svg>
