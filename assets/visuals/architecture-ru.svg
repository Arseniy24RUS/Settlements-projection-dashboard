<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура Settlements Projection Dashboard</title>
  <desc id="desc">Данные населённых пунктов переходят в фильтры и прогнозные наборы, затем в карту, графики, пирамиду и экспорт.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1200" height="460" fill="#eef3f8"/>
  <text x="56" y="70" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Архитектура статического дашборда</text>
  <text x="56" y="105" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Клиентская аналитика населённых пунктов для публикации на GitHub Pages</text>
  <g filter="url(#shadow)">
    <rect x="56" y="158" width="236" height="190" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="334" y="158" width="236" height="190" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="612" y="158" width="236" height="190" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="890" y="158" width="236" height="190" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="82" y="204" font-size="23" font-weight="700" fill="#0f172a">Данные поселений</text>
    <text x="82" y="244" font-size="17" fill="#475569">реестр и идентификаторы</text>
    <text x="82" y="274" font-size="17" fill="#475569">численность и координаты</text>
    <text x="82" y="304" font-size="17" fill="#475569">возрастно-половые входы</text>
    <circle cx="252" cy="198" r="18" fill="#dbeafe"/>
    <text x="247" y="205" font-size="18" font-weight="700" fill="#1d4ed8">1</text>

    <text x="360" y="204" font-size="23" font-weight="700" fill="#0f172a">Фильтры и прогнозы</text>
    <text x="360" y="244" font-size="17" fill="#475569">субъект и муниципалитет</text>
    <text x="360" y="274" font-size="17" fill="#475569">сценарий и год карты</text>
    <text x="360" y="304" font-size="17" fill="#475569">прогнозные таблицы</text>
    <circle cx="530" cy="198" r="18" fill="#dbeafe"/>
    <text x="525" y="205" font-size="18" font-weight="700" fill="#1d4ed8">2</text>

    <text x="638" y="204" font-size="23" font-weight="700" fill="#0f172a">Карта, графики, пирамида</text>
    <text x="638" y="244" font-size="17" fill="#475569">слой населённых пунктов</text>
    <text x="638" y="274" font-size="17" fill="#475569">динамика численности</text>
    <text x="638" y="304" font-size="17" fill="#475569">возрастно-половая структура</text>
    <circle cx="808" cy="198" r="18" fill="#dcfce7"/>
    <text x="803" y="205" font-size="18" font-weight="700" fill="#047857">3</text>

    <text x="916" y="204" font-size="23" font-weight="700" fill="#0f172a">Экспорт</text>
    <text x="916" y="244" font-size="17" fill="#475569">PNG-графики</text>
    <text x="916" y="274" font-size="17" fill="#475569">XLSX-таблицы</text>
    <text x="916" y="304" font-size="17" fill="#475569">передача в исследование</text>
    <circle cx="1086" cy="198" r="18" fill="#fce7f3"/>
    <text x="1081" y="205" font-size="18" font-weight="700" fill="#be185d">4</text>
  </g>
  <g stroke="#2563eb" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
    <line x1="292" y1="253" x2="326" y2="253"/>
    <line x1="570" y1="253" x2="604" y2="253"/>
    <line x1="848" y1="253" x2="882" y2="253"/>
  </g>
  <rect x="56" y="384" width="1070" height="34" rx="17" fill="#e0f2fe"/>
  <text x="78" y="407" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#075985">Браузер загружает компактные файлы данных и обновляет аналитические представления без серверной части.</text>
</svg>
